<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nyelvtanya</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐮</text></svg>">
<style>
  :root {
    --sky1: #bae6fd; --sky2: #f0f9ff; --grass: #86efac; --grass2: #4ade80;
    --ink: #1f2937; --soft: #6b7280; --card: #ffffff; --line: #e5e7eb;
    --barn: #dc2626; --barn2: #991b1b; --wood: #a16207;
    --pri: #16a34a; --pri2: #86efac;
    --ok: #16a34a; --okbg: #dcfce7; --bad: #dc2626; --badbg: #fee2e2; --gold: #f59e0b;
    --k: #2563eb; --kbg: #dbeafe; --j: #9333ea; --jbg: #f3e8ff; --r: #ea580c; --rbg: #ffedd5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Segoe UI Rounded", "Nunito", "Segoe UI", system-ui, sans-serif; color: var(--ink);
    background: linear-gradient(180deg, var(--sky1) 0, var(--sky2) 55%, #dcfce7 100%); background-attachment: fixed;
    user-select: none; -webkit-user-select: none; touch-action: manipulation; overflow-x: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  .screen { display: none; min-height: 100vh; padding: 16px; max-width: 1000px; margin: 0 auto; flex-direction: column; }
  .screen.on { display: flex; }
  .center { text-align: center; }

  /* ---------- Fejléc, kabala ---------- */
  .hero { text-align: center; margin-top: 4px; }
  .cow { display: inline-block; width: 96px; height: 96px; animation: bob 2.8s ease-in-out infinite; }
  .cow.sm { width: 54px; height: 54px; }
  .cow svg { width: 100%; height: 100%; display: block; overflow: visible; }
  @keyframes bob { 50% { transform: translateY(-7px) rotate(-5deg); } }
  h1 { font-size: 48px; margin: 2px 0 0; color: var(--barn); text-shadow: 0 3px 0 #fff, 0 5px 0 rgba(0,0,0,.08); letter-spacing: .5px; }
  .hello { font-size: 21px; color: var(--soft); margin: 4px 0 12px; font-weight: 600; }
  .statsrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .pill { background: var(--card); border-radius: 18px; padding: 9px 16px; font-size: 18px; font-weight: 800; box-shadow: 0 3px 0 var(--line); display: flex; align-items: center; gap: 8px; }
  .bubble { position: relative; background: #fff; border-radius: 20px; padding: 12px 18px; font-size: 19px; font-weight: 700; box-shadow: 0 4px 0 var(--line); max-width: 560px; margin: 0 auto 6px; }
  .bubble:after { content: ''; position: absolute; left: 50%; bottom: -12px; margin-left: -10px; border: 12px solid transparent; border-top-color: #fff; border-bottom: 0; }

  /* ---------- A tanya ---------- */
  .farm { position: relative; margin-top: 10px; padding: 18px 10px 30px; border-radius: 34px;
          background: linear-gradient(180deg, var(--grass) 0, var(--grass2) 100%); box-shadow: inset 0 6px 0 rgba(255,255,255,.35); }
  .farm:before { content: '🌳'; position: absolute; left: 10px; top: -30px; font-size: 52px; }
  .farm:after { content: '🌻 🌼 🌻'; position: absolute; right: 14px; bottom: 6px; font-size: 22px; letter-spacing: 4px; }
  .barns { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
  .barnbtn { border: 0; background: none; padding: 0; position: relative; transition: transform .1s; text-align: center; }
  .barnbtn:active { transform: scale(.96); }
  .barnbtn svg { width: 100%; max-width: 260px; height: auto; display: block; margin: 0 auto; filter: drop-shadow(0 6px 0 rgba(0,0,0,.15)); }
  .barnbtn .bname { display: inline-block; margin-top: -6px; background: #fff; border-radius: 16px; padding: 6px 14px; font-weight: 900; font-size: 20px; box-shadow: 0 4px 0 rgba(0,0,0,.12); position: relative; }
  .barnbtn .bsub { display: block; font-size: 15px; font-weight: 700; color: #14532d; margin-top: 6px; }
  .barnbtn.locked { filter: grayscale(.85); opacity: .75; }
  .barnbtn .stars { position: absolute; top: 4px; right: 12px; background: #fff; border-radius: 99px; padding: 4px 10px; font-weight: 900; font-size: 16px; box-shadow: 0 3px 0 rgba(0,0,0,.12); }

  .footer { text-align: center; margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .ghost { background: rgba(255,255,255,.8); border: 0; border-radius: 14px; padding: 10px 16px; font-size: 16px; font-weight: 800; color: var(--soft); }
  .ghost.g { color: #fff; background: #4285f4; }

  /* ---------- Pajta belseje ---------- */
  .roomhead { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .roomhead h2 { margin: 0; font-size: 30px; flex: 1; }
  .rooms { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .room { border: 0; border-radius: 26px; padding: 18px; font-size: 22px; font-weight: 900; color: #fff; text-align: left;
          box-shadow: 0 6px 0 rgba(0,0,0,.18); display: flex; flex-direction: column; gap: 6px; transition: transform .08s; }
  .room:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .room .ic { font-size: 38px; }
  .room small { font-size: 15px; font-weight: 700; opacity: .95; }
  .room .bar { background: rgba(255,255,255,.35); }
  .room .bar > i { background: #fff; }
  .c1 { background: linear-gradient(135deg, #16a34a, #0d9488); } .c2 { background: linear-gradient(135deg, #f59e0b, #ea580c); }
  .c3 { background: linear-gradient(135deg, #8b5cf6, #db2777); } .c4 { background: linear-gradient(135deg, #0ea5e9, #2563eb); }
  .c5 { background: linear-gradient(135deg, #94a3b8, #475569); } .c6 { background: linear-gradient(135deg, #ef4444, #b91c1c); }
  .bar { height: 14px; background: #f1f5f9; border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #86efac, #16a34a); transition: width .6s; }

  /* ---------- Kvíz ---------- */
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .iconbtn { width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--card); font-size: 25px; box-shadow: 0 4px 0 var(--line); flex: none; }
  .iconbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .progress { flex: 1; height: 22px; background: rgba(255,255,255,.85); border-radius: 99px; overflow: hidden; }
  .progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #86efac, #16a34a); border-radius: 99px; transition: width .4s; }
  .score { font-size: 21px; font-weight: 900; background: var(--card); padding: 12px 14px; border-radius: 18px; box-shadow: 0 4px 0 var(--line); min-width: 92px; text-align: center; }
  .combo { font-size: 18px; font-weight: 900; color: #ea580c; min-width: 62px; text-align: center; }
  .combo.pop { animation: pop .4s; }
  @keyframes pop { 40% { transform: scale(1.5); } }

  .card { background: var(--card); border-radius: 30px; padding: 24px 24px 22px; box-shadow: 0 8px 0 var(--line); }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 900; color: #fff; padding: 6px 14px; border-radius: 99px; background: var(--pri); }
  .qtitle { font-size: 21px; color: var(--soft); font-weight: 800; margin: 14px 0 6px; }
  .big-word { font-size: 52px; font-weight: 900; letter-spacing: 1px; margin: 10px 0; text-align: center; word-break: break-word; }
  .big-word .gap { display: inline-block; min-width: 64px; border-bottom: 6px dashed #9ca3af; color: var(--pri); text-align: center; margin: 0 2px; }
  .big-word .gap.cur { border-bottom-color: var(--gold); background: #fef3c7; border-radius: 10px 10px 0 0; }
  .big-word .gap.done { border-bottom-style: solid; border-bottom-color: var(--pri2); min-width: 0; margin: 0; }
  .hint { font-size: 19px; color: var(--soft); text-align: center; font-weight: 600; }
  .opts { display: grid; gap: 14px; margin-top: 20px; }
  .opts.g2 { grid-template-columns: 1fr 1fr; } .opts.g3 { grid-template-columns: repeat(3, 1fr); }
  .opt { border: 3px solid var(--line); background: #fff; border-radius: 22px; padding: 16px 12px; font-size: 28px; font-weight: 900;
         box-shadow: 0 5px 0 var(--line); text-align: center; min-height: 78px; transition: transform .08s; }
  .opt.sm { font-size: 21px; }
  .opt:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
  .opt.sel { border-color: var(--gold); background: #fffbeb; box-shadow: 0 5px 0 #fcd34d; }
  .opt.ok { border-color: var(--ok); background: var(--okbg); box-shadow: 0 5px 0 #86efac; }
  .opt.bad { border-color: var(--bad); background: var(--badbg); box-shadow: 0 5px 0 #fca5a5; animation: shake .35s; }
  .opt.dim { opacity: .45; }
  .opt:disabled { cursor: default; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .jly { font-size: 44px; min-height: 100px; }

  /* betű- és szótagkirakó */
  .slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 76px; margin: 16px 0 6px; padding: 10px; border-radius: 20px; background: #f9fafb; border: 3px dashed var(--line); }
  .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 14px; }
  .tile { border: 3px solid var(--line); background: #fff; border-radius: 16px; min-width: 60px; height: 64px; padding: 0 12px; font-size: 30px; font-weight: 900; box-shadow: 0 4px 0 var(--line); }
  .tile.used { visibility: hidden; }
  .slots .tile { border-color: var(--pri2); }
  .flash { font-size: 54px; font-weight: 900; text-align: center; margin: 18px 0; color: var(--pri); }
  .flash.hide { color: transparent; text-shadow: 0 0 22px rgba(0,0,0,.35); }

  /* szóelemek */
  .morph { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 4px; margin: 14px 0; font-size: 50px; font-weight: 900; }
  .seg { border: 0; background: #f3f4f6; border-radius: 14px; padding: 4px 10px; font: inherit; border-bottom: 6px solid #d1d5db; }
  .seg.hl { background: #fef3c7; border-bottom-color: var(--gold); }
  .seg.t-k { background: var(--kbg); border-bottom-color: var(--k); color: var(--k); }
  .seg.t-j { background: var(--jbg); border-bottom-color: var(--j); color: var(--j); }
  .seg.t-r { background: var(--rbg); border-bottom-color: var(--r); color: var(--r); }
  .seg.t-t { background: var(--okbg); border-bottom-color: var(--ok); }
  .letters { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; margin: 18px 0; font-size: 50px; font-weight: 900; }
  .letters .cut { border: 0; background: none; width: 30px; height: 70px; padding: 0; position: relative; }
  .letters .cut:before { content: ''; position: absolute; left: 13px; top: 6px; bottom: 6px; width: 4px; border-radius: 4px; background: #e5e7eb; }
  .letters .cut.on:before { background: var(--barn); width: 6px; left: 12px; }
  .letters .cut.miss:before { background: var(--gold); }
  .legend { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; font-weight: 800; font-size: 16px; }
  .legend span { padding: 4px 12px; border-radius: 99px; }

  .feedback { margin-top: 18px; border-radius: 22px; padding: 16px 18px; font-size: 20px; display: none; }
  .feedback.on { display: block; animation: rise .3s; }
  .feedback.ok { background: var(--okbg); } .feedback.bad { background: var(--badbg); }
  .feedback h3 { margin: 0 0 6px; font-size: 26px; }
  .feedback .why { margin-top: 8px; font-size: 18px; background: rgba(255,255,255,.7); border-radius: 14px; padding: 10px 12px; }
  @keyframes rise { from { transform: translateY(10px); opacity: 0; } }
  .nextbtn { margin-top: 16px; width: 100%; border: 0; border-radius: 22px; padding: 18px; font-size: 26px; font-weight: 900; color: #fff;
             background: linear-gradient(135deg, #16a34a, #0d9488); box-shadow: 0 6px 0 #166534; }
  .nextbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #166534; }
  .nextbtn.y { background: linear-gradient(135deg, #f59e0b, #ea580c); box-shadow: 0 6px 0 #9a3412; }

  /* ---------- Eredmény, modal ---------- */
  .result { text-align: center; max-width: 560px; margin: 20px auto; width: 100%; }
  .result .bigstars { font-size: 64px; letter-spacing: 6px; }
  .result h2 { font-size: 36px; margin: 6px 0; }
  .modal { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal.on { display: flex; }
  .modal .card { max-width: 560px; width: 100%; max-height: 90vh; overflow: auto; }
  .namebox input { font: inherit; font-size: 30px; padding: 14px; border-radius: 18px; border: 3px solid var(--line); width: 100%; text-align: center; margin: 14px 0; user-select: text; }
  .namebox input:focus { outline: none; border-color: var(--pri2); }
  table.list { width: 100%; border-collapse: collapse; font-size: 17px; }
  table.list td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .floatpts { position: fixed; font-size: 34px; font-weight: 900; color: var(--gold); pointer-events: none; animation: up 1s forwards; z-index: 60; text-shadow: 0 2px 0 #fff; }
  @keyframes up { to { transform: translateY(-80px); opacity: 0; } }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; }

  @media (max-width: 560px) {
    h1 { font-size: 38px; } .big-word { font-size: 40px; } .morph, .letters { font-size: 38px; }
    .opt { font-size: 22px; } .opts.g3 { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<!-- Belépés / név -->
<section class="screen" id="s-name">
  <div class="namebox card" style="max-width:520px;margin:40px auto;text-align:center">
    <div class="cow"></div>
    <h1>Nyelvtanya</h1>
    <p class="hello">Szia! Én Riska vagyok, a tanya tehene. Hogy hívnak?</p>
    <input id="nameinput" maxlength="20" placeholder="A neved" autocomplete="off">
    <button class="nextbtn" id="namego">Indulás a tanyára! 🚜</button>
    <p id="name-google" class="hint" style="margin-top:14px"></p>
  </div>
</section>

<!-- Tanya -->
<section class="screen" id="s-farm">
  <div class="hero">
    <div class="bubble" id="riska-says">Muu! Jó, hogy itt vagy!</div>
    <div class="cow"></div>
    <h1>Nyelvtanya</h1>
  </div>
  <div class="statsrow">
    <div class="pill" title="Tejesüvegek">🥛 <span id="h-milk">0</span></div>
    <div class="pill" title="Napi sorozat">🔥 <span id="h-streak">0 nap</span></div>
    <div class="pill" id="h-rank">🌱 Tanyasi csemete</div>
  </div>
  <div class="farm"><div class="barns" id="barns"></div></div>
  <div class="footer">
    <button class="ghost" id="b-sound">🔊 Hang: be</button>
    <button class="ghost" id="b-parent">👪 Szülői sarok</button>
    <button class="ghost" id="b-account">👤 Fiók</button>
  </div>
</section>

<!-- Pajta belseje -->
<section class="screen" id="s-barn">
  <div class="roomhead">
    <button class="iconbtn back" title="Vissza a tanyára">🏡</button>
    <h2 id="barn-title"></h2>
  </div>
  <div class="bubble" id="barn-intro" style="margin:0 0 16px;max-width:none"></div>
  <div class="rooms" id="rooms"></div>
</section>

<!-- Kvíz -->
<section class="screen" id="s-quiz">
  <div class="topbar">
    <button class="iconbtn" id="q-quit" title="Kilépés">✖</button>
    <div class="progress"><i id="q-prog"></i></div>
    <div class="combo" id="q-combo"></div>
    <div class="score">🥛 <span id="q-score">0</span></div>
  </div>
  <div class="card" id="q-card"></div>
</section>

<!-- Eredmény -->
<section class="screen" id="s-result">
  <div class="result card">
    <div class="cow"></div>
    <div class="bigstars" id="r-stars"></div>
    <h2 id="r-title"></h2>
    <p class="hello" id="r-text"></p>
    <div id="r-list"></div>
    <button class="nextbtn" id="r-again">Még egy kör! 🔁</button>
    <button class="nextbtn y" id="r-home">Vissza a pajtába 🏠</button>
  </div>
</section>

<div class="modal" id="modal"><div class="card" id="modalcard"></div></div>
<canvas id="confetti"></canvas>

<script src="firebase-config.js"></script>
<script src="data/jly.js"></script>
<script src="data/ige.js"></script>
<script src="data/toldalek.js"></script>
<script src="js/motor.js"></script>
<script src="js/jly.js"></script>
<script src="js/ige.js"></script>
<script src="js/toldalek.js"></script>
<script src="js/tanya.js"></script>
<script type="module" src="js/fiok.js"></script>
</body>
</html>
